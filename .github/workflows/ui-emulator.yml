name: TermuxPro Emulator UI

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: ['dev_*', 'hotfix_*']
  pull_request:
    branches: [dev, master]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - '.github/workflows/ui-emulator.yml'
      - 'scripts/verify-ui-screenshots.sh'
      - 'test/plans/ui-screenshot-manifest.txt'

concurrency:
  group: emulator-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 安装模拟器、系统镜像与 NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64' 'ndk;29.0.14206865'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: 创建并启动隔离模拟器
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name termuxpro-ci --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" @termuxpro-ci \
            -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect \
            -memory 2048 > "$RUNNER_TEMP/termuxpro-emulator.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 120s adb wait-for-device; then
            echo '模拟器设备发现超时' >&2
            cat "$RUNNER_TEMP/termuxpro-emulator.log" >&2
            exit 1
          fi
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '模拟器进程在启动期间退出' >&2
              cat "$RUNNER_TEMP/termuxpro-emulator.log" >&2
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo '模拟器启动超时' >&2
          cat "$RUNNER_TEMP/termuxpro-emulator.log" >&2
          exit 1
      - name: 配置 360dp 深色测试设备
        run: |
          adb shell wm size 720x1600
          adb shell wm density 320
          adb shell cmd uimode night yes
          adb shell settings put system font_scale 1.0
      - name: 默认字体页面截图
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.screenshotSuffix=default
          mkdir -p test-artifacts/emulator-ui/default
          adb pull /sdcard/Pictures/termuxpro-ui-screenshots/. \
            test-artifacts/emulator-ui/default/
          ./scripts/verify-ui-screenshots.sh test-artifacts/emulator-ui/default default
          adb shell rm -f /sdcard/Pictures/termuxpro-ui-screenshots/'*.png'
      - name: 200% 字体页面截图
        run: |
          adb shell settings put system font_scale 2.0
          adb shell am force-stop com.termux
          ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.screenshotSuffix=font200
          mkdir -p test-artifacts/emulator-ui/font200
          adb pull /sdcard/Pictures/termuxpro-ui-screenshots/. \
            test-artifacts/emulator-ui/font200/
          ./scripts/verify-ui-screenshots.sh test-artifacts/emulator-ui/font200 font200
      - name: 正式签名 Release APK 覆盖升级与启动冒烟
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_name="$(./scripts/termuxpro-version.sh name)"
          candidate_code="$(./scripts/termuxpro-version.sh code)"
          candidate_tag="v$candidate_name"
          baseline_tag="$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName')"
          [[ -n "$baseline_tag" && "$baseline_tag" != "$candidate_tag" ]]
          mkdir -p "$RUNNER_TEMP/release-baseline" "$RUNNER_TEMP/release-candidate" \
            test-artifacts/emulator-ui/release-apk
          gh release download "$baseline_tag" --pattern '*.apk' --pattern 'SHA256SUMS' \
            --dir "$RUNNER_TEMP/release-baseline"
          gh release download "$candidate_tag" --pattern '*.apk' --pattern 'SHA256SUMS' \
            --dir "$RUNNER_TEMP/release-candidate"
          (cd "$RUNNER_TEMP/release-baseline" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/release-candidate" && sha256sum -c SHA256SUMS)
          baseline_apk="$(find "$RUNNER_TEMP/release-baseline" -maxdepth 1 -name '*.apk' -print -quit)"
          candidate_apk="$(find "$RUNNER_TEMP/release-candidate" -maxdepth 1 -name '*.apk' -print -quit)"
          export AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ./scripts/verify-release-apk-on-device.sh "$baseline_apk" "$candidate_apk" \
            "$candidate_name" "$candidate_code" test-artifacts/emulator-ui/release-apk
      - name: 收集截图与 UI 层级
        if: always()
        run: |
          mkdir -p test-artifacts/emulator-ui
          adb shell uiautomator dump /sdcard/window.xml || true
          adb pull /sdcard/window.xml test-artifacts/emulator-ui/window.xml || true
          cp "$RUNNER_TEMP/termuxpro-emulator.log" test-artifacts/emulator-ui/ || true
      - name: 上传模拟器验收证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-emulator-ui-${{ github.run_number }}
          path: |
            test-artifacts/emulator-ui/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 30
      - name: 关闭模拟器
        if: always()
        run: adb emu kill || true
