name: 自动创建研发 PR

on:
  push:
    branches: ['dev_*', 'hotfix_*']

concurrency:
  group: auto-dev-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 创建或复用 dev PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          GH_COMMAND_TIMEOUT_SECONDS: 45
        run: |
          gh_safe() {
            timeout --foreground "${GH_COMMAND_TIMEOUT_SECONDS:-45}s" gh "$@"
          }

          gh_retry() {
            local attempt
            local max_attempts=3
            for attempt in $(seq 1 "$max_attempts"); do
              if gh_safe "$@"; then
                return 0
              fi
              echo "GitHub CLI 调用失败或超时：gh $*；第 $attempt/$max_attempts 次。" >&2
              sleep $((attempt * 5))
            done
            echo "GitHub CLI 调用连续失败：gh $*" >&2
            return 1
          }

          title="${COMMIT_TITLE%%$'\n'*}"
          existing="$(gh_retry pr list --repo "$REPOSITORY" --base dev --head "$HEAD_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "研发 PR #$existing 已存在。"
            pr_number="$existing"
          else
            pr_url="$(gh_retry api --method POST "repos/$REPOSITORY/pulls" \
              -f base=dev \
              -f head="$HEAD_BRANCH" \
              -f title="$title" \
              -f body="由 TermuxPro 自治研发流水线创建。完整变更、测试证据与验收结果以本 PR 的提交和 Checks 为准。\n\n触发提交：\`$COMMIT_SHA\`" \
              --jq '.html_url')"
            pr_number="${pr_url##*/}"
          fi

          is_static_only_file() {
            case "$1" in
              README.md|AGENTS.md|docs/**|test/reports/**|.agents/skills/**/*.md|.claude/skills/**/*.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_emulator_ui_file() {
            case "$1" in
              app/src/main/**|app/src/androidTest/**|app/build.gradle|terminal-view/src/main/**|.github/workflows/ui-emulator.yml|scripts/verify-ui-screenshots.sh|test/plans/ui-screenshot-manifest.txt)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          requires_android_ci=false
          requires_emulator_ui=false
          mapfile -t pr_files < <(gh_retry pr view "$pr_number" --repo "$REPOSITORY" \
            --json files --jq '.files[].path')
          for file in "${pr_files[@]}"; do
            if ! is_static_only_file "$file"; then
              requires_android_ci=true
            fi
            if is_emulator_ui_file "$file"; then
              requires_emulator_ui=true
            fi
          done
          echo "Android 运行时门禁：$requires_android_ci；模拟器 UI 门禁：$requires_emulator_ui。"

          wait_for_workflow() {
            workflow="$1"
            label="$2"
            target_sha="${3:-$COMMIT_SHA}"
            target_ref="${4:-$HEAD_BRANCH}"
            for attempt in $(seq 1 180); do
              args=(run list --repo "$REPOSITORY" --workflow "$workflow" --limit 20 \
                --json status,conclusion,databaseId,event,headSha,headBranch)
              if [[ -n "$target_ref" ]]; then
                args+=(--branch "$target_ref")
              fi
              if ! record="$(gh_safe "${args[@]}" \
                --jq "map(select((.event == \"push\" or .event == \"workflow_dispatch\") and .headSha == \"$target_sha\"))[0] // empty")"; then
                echo "$label 查询 GitHub Actions 超时或失败，第 $attempt 次后继续等待。"
                sleep 20
                continue
              fi
              if [[ -n "$record" ]]; then
                status="$(jq -r '.status' <<<"$record")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
                echo "$label：$status ${conclusion:-等待结论}"
                if [[ "$status" == 'completed' ]]; then
                  [[ "$conclusion" == 'success' ]] && return 0
                  echo "$label 未通过，保留 PR #$pr_number。" >&2
                  return 1
                fi
              else
                echo "$label 尚未创建，等待触发。"
              fi
              sleep 20
            done
            echo "$label 等待超时，保留 PR #$pr_number。" >&2
            return 1
          }

          wait_for_candidate_release() {
            tag="$1"
            version_name="$2"
            target_sha="$3"
            apk_name="termuxpro-$version_name-arm64-v8a.apk"
            for attempt in $(seq 1 180); do
              args=(run list --repo "$REPOSITORY" --workflow '.github/workflows/release.yml' \
                --limit 20 --json status,conclusion,databaseId,event,headSha,headBranch)
              if record="$(gh_safe "${args[@]}" \
                --jq "map(select((.event == \"push\" or .event == \"workflow_dispatch\") and .headSha == \"$target_sha\"))[0] // empty")"; then
                if [[ -n "$record" ]]; then
                  status="$(jq -r '.status' <<<"$record")"
                  conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
                  echo "候选 Release run：$status ${conclusion:-等待结论}"
                  if [[ "$status" == 'completed' && "$conclusion" != 'success' ]]; then
                    echo "候选 Release 未通过，保留证据。" >&2
                    return 1
                  fi
                  if [[ "$status" == 'completed' && "$conclusion" == 'success' ]]; then
                    return 0
                  fi
                else
                  echo "候选 Release run 尚未创建，等待触发。"
                fi
              else
                echo "候选 Release run 查询超时或失败，第 $attempt 次后继续等待。"
              fi

              if release_json="$(gh_safe release view "$tag" --repo "$REPOSITORY" \
                --json isDraft,isPrerelease,assets 2>/dev/null)"; then
                if jq -e --arg apk "$apk_name" '
                  .isDraft == false and .isPrerelease == true
                  and ([.assets[].name] | index($apk) != null)
                  and ([.assets[].name] | index("SHA256SUMS") != null)
                  and ([.assets[].name] | index("APK_SIGNATURE.txt") != null)
                ' <<<"$release_json" >/dev/null; then
                  echo "候选 Release 已发布且附件齐全：$tag。"
                  return 0
                fi
              fi
              sleep 20
            done
            echo "候选 Release 等待超时，保留 PR #$pr_number 与标签 $tag。" >&2
            return 1
          }

          if ! wait_for_workflow '.github/workflows/ci.yml' '完整 CI'; then
            echo "预合并完整 CI 未通过；PR #$pr_number 已保留等待后续提交修复，自动 PR 工作流不再重复上报失败。"
            exit 0
          fi
          if [[ "$requires_emulator_ui" == true ]]; then
            if ! wait_for_workflow '.github/workflows/ui-emulator.yml' '模拟器 UI'; then
              echo "预合并模拟器 UI 未通过；PR #$pr_number 已保留等待后续提交修复，自动 PR 工作流不再重复上报失败。"
              exit 0
            fi
          else
            echo "未检测到 UI 运行时变更，跳过预合并模拟器 UI 等待。"
          fi

          is_candidate_release_branch() {
            [[ "$HEAD_BRANCH" =~ ^dev_release[0-9]+Rc[1-9][0-9]*_[0-9]{8}$ ]]
          }

          should_publish_candidate=false
          candidate_version_name=''
          if is_candidate_release_branch; then
            head_version_file="$(gh_retry api "repos/$REPOSITORY/contents/termuxpro-version.properties?ref=$COMMIT_SHA" \
              --jq '.content' | base64 --decode)"
            candidate_version_name="$(sed -n 's/^versionName=//p' <<<"$head_version_file")"
            if [[ "$candidate_version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
              should_publish_candidate=true
            else
              echo "分支 $HEAD_BRANCH 命中候选发布分支格式，但版本号 $candidate_version_name 不是候选版本；按普通研发 PR 合并，不创建候选 Release。"
            fi
          elif [[ "$HEAD_BRANCH" == dev_release* ]]; then
            echo "分支 $HEAD_BRANCH 不是候选发布分支格式；按普通研发 PR 合并，不创建候选 Release。"
          fi

          gh_retry pr merge "$pr_number" --repo "$REPOSITORY" --merge \
            --subject "Merge pull request #$pr_number from ${{ github.repository_owner }}/$HEAD_BRANCH" \
            --body "$title"
          merge_sha="$(gh_retry pr view "$pr_number" --repo "$REPOSITORY" --json mergeCommit \
            --jq '.mergeCommit.oid')"
          if [[ "$requires_android_ci" == true ]]; then
            gh_retry workflow run '.github/workflows/ci.yml' --repo "$REPOSITORY" --ref dev
          else
            gh_retry workflow run '.github/workflows/ci.yml' --repo "$REPOSITORY" --ref dev \
              -f androidRuntime=false
          fi
          wait_for_workflow '.github/workflows/ci.yml' 'dev 合并后 CI' "$merge_sha" dev

          if [[ "$should_publish_candidate" == true ]]; then
            version_name="$candidate_version_name"
            tag="v$version_name"
            if existing_tag="$(gh_safe api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$existing_tag" == "$merge_sha" ]] || {
                echo "标签 $tag 已指向其他提交，拒绝覆盖。" >&2
                exit 1
              }
            else
              gh_retry api --method POST "repos/$REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$merge_sha" >/dev/null
            fi
            gh_retry workflow run '.github/workflows/release.yml' --repo "$REPOSITORY" --ref "$tag"
            wait_for_candidate_release "$tag" "$version_name" "$merge_sha"
          fi
