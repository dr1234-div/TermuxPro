name: 自动创建研发 PR

on:
  push:
    branches: ['dev_*', 'hotfix_*']

concurrency:
  group: auto-dev-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 创建或复用 dev PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          title="${COMMIT_TITLE%%$'\n'*}"
          existing="$(gh pr list --repo "$REPOSITORY" --base dev --head "$HEAD_BRANCH" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "研发 PR #$existing 已存在。"
            pr_number="$existing"
          else
            pr_url="$(gh pr create --repo "$REPOSITORY" --base dev --head "$HEAD_BRANCH" \
              --title "$title" \
              --body "由 TermuxPro 自治研发流水线创建。完整变更、测试证据与验收结果以本 PR 的提交和 Checks 为准。\n\n触发提交：\`$COMMIT_SHA\`")"
            pr_number="${pr_url##*/}"
          fi

          wait_for_workflow() {
            workflow="$1"
            label="$2"
            target_sha="${3:-$COMMIT_SHA}"
            for attempt in $(seq 1 180); do
              record="$(gh run list --repo "$REPOSITORY" --commit "$target_sha" \
                --workflow "$workflow" --limit 10 --json status,conclusion,databaseId,event \
                --jq 'map(select(.event == "push" or .event == "workflow_dispatch"))[0] // empty')"
              if [[ -n "$record" ]]; then
                status="$(jq -r '.status' <<<"$record")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
                echo "$label：$status ${conclusion:-等待结论}"
                if [[ "$status" == 'completed' ]]; then
                  [[ "$conclusion" == 'success' ]] && return 0
                  echo "$label 未通过，保留 PR #$pr_number。" >&2
                  return 1
                fi
              else
                echo "$label 尚未创建，等待触发。"
              fi
              sleep 20
            done
            echo "$label 等待超时，保留 PR #$pr_number。" >&2
            return 1
          }

          wait_for_workflow '.github/workflows/ci.yml' '完整 CI'
          wait_for_workflow '.github/workflows/ui-emulator.yml' '模拟器 UI'

          should_publish_candidate=false
          candidate_version_name=''
          if [[ "$HEAD_BRANCH" == dev_release* ]]; then
            head_version_file="$(gh api "repos/$REPOSITORY/contents/termuxpro-version.properties?ref=$COMMIT_SHA" \
              --jq '.content' | base64 --decode)"
            candidate_version_name="$(sed -n 's/^versionName=//p' <<<"$head_version_file")"
            if [[ "$candidate_version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
              should_publish_candidate=true
            else
              echo "分支 $HEAD_BRANCH 命中 dev_release*，但版本号 $candidate_version_name 不是候选版本；按普通研发 PR 合并，不创建候选 Release。"
            fi
          fi

          gh pr merge "$pr_number" --repo "$REPOSITORY" --merge \
            --subject "Merge pull request #$pr_number from ${{ github.repository_owner }}/$HEAD_BRANCH" \
            --body "$title"
          merge_sha="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json mergeCommit \
            --jq '.mergeCommit.oid')"
          gh workflow run '.github/workflows/ci.yml' --repo "$REPOSITORY" --ref dev
          wait_for_workflow '.github/workflows/ci.yml' 'dev 合并后 CI' "$merge_sha"

          if [[ "$should_publish_candidate" == true ]]; then
            version_name="$candidate_version_name"
            tag="v$version_name"
            if existing_tag="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$existing_tag" == "$merge_sha" ]] || {
                echo "标签 $tag 已指向其他提交，拒绝覆盖。" >&2
                exit 1
              }
            else
              gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$merge_sha" >/dev/null
            fi
            gh workflow run '.github/workflows/release.yml' --repo "$REPOSITORY" --ref "$tag"
            wait_for_workflow '.github/workflows/release.yml' '候选 Release' "$merge_sha"
          fi
