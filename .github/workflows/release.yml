name: TermuxPro Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 安装 Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: 恢复 Release 签名材料
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo '缺少 TermuxPro Release 签名 Secrets。' >&2
            exit 1
          fi
          install -d -m 700 .signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .signing/termuxpro-release.p12
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > .signing/termuxpro-release.pass
          chmod 600 .signing/termuxpro-release.p12 .signing/termuxpro-release.pass
      - name: 测试、校验并构建正式 APK
        run: |
          for attempt in 1 2 3; do
            echo "正式构建：第 $attempt 次尝试"
            if ./scripts/build-termuxpro-release.sh; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo '构建失败，等待 10 秒后重试，以容忍依赖下载连接重置。'
              sleep 10
            fi
          done
          exit 1
      - name: 上传正式 APK 与校验报告
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-release-${{ github.run_number }}
          path: dist/0.1.0/
          if-no-files-found: error
          retention-days: 30
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/0.1.0/termuxpro-0.1.0-arm64-v8a.apk \
            dist/0.1.0/SHA256SUMS \
            dist/0.1.0/APK_SIGNATURE.txt \
            --verify-tag \
            --title "TermuxPro $GITHUB_REF_NAME" \
            --notes-file dist/0.1.0/RELEASE_NOTES.md
