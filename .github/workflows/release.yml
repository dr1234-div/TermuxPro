name: TermuxPro Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 校验唯一版本源与标签
        id: version
        run: |
          version_name="$(./scripts/termuxpro-version.sh name)"
          version_code="$(./scripts/termuxpro-version.sh code)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./scripts/termuxpro-version.sh tag "$GITHUB_REF_NAME" >/dev/null
            echo "TERMUXPRO_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "dist=dist/$version_name" >> "$GITHUB_OUTPUT"
      - name: 安装 Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: 恢复 Release 签名材料
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo '缺少 TermuxPro Release 签名 Secrets。' >&2
            exit 1
          fi
          install -d -m 700 .signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .signing/termuxpro-release.p12
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > .signing/termuxpro-release.pass
          chmod 600 .signing/termuxpro-release.p12 .signing/termuxpro-release.pass
      - name: 测试、校验并构建正式 APK
        run: |
          for attempt in 1 2 3; do
            echo "正式构建：第 $attempt 次尝试"
            if ./scripts/build-termuxpro-release.sh; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo '构建失败，等待 10 秒后重试，以容忍依赖下载连接重置。'
              sleep 10
            fi
          done
          exit 1
      - name: 上传正式 APK 与校验报告
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ steps.version.outputs.dist }}/
          if-no-files-found: error
          retention-days: 30
      - name: 安装模拟器系统镜像
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' \
            'system-images;android-35;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: 创建并启动发布验收模拟器
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name termuxpro-release --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" @termuxpro-release \
            -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect \
            -memory 2048 > "$RUNNER_TEMP/termuxpro-release-emulator.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 120s adb wait-for-device; then
            echo '发布验收模拟器设备发现超时' >&2
            cat "$RUNNER_TEMP/termuxpro-release-emulator.log" >&2
            exit 1
          fi
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '发布验收模拟器在启动期间退出' >&2
              cat "$RUNNER_TEMP/termuxpro-release-emulator.log" >&2
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo '发布验收模拟器启动超时' >&2
          cat "$RUNNER_TEMP/termuxpro-release-emulator.log" >&2
          exit 1
      - name: 验收待发布签名 APK 的覆盖升级
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="${{ steps.version.outputs.name }}"
          version_code="${{ steps.version.outputs.code }}"
          baseline_tag="$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' \
            | ./scripts/select-stable-baseline-tag.sh "$version_name")"
          if [[ -z "$baseline_tag" ]]; then
            echo "未找到低于 $version_name 的稳定 Release 基线。" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-baseline" test-artifacts/release-apk
          gh release download "$baseline_tag" --pattern '*.apk' --pattern 'SHA256SUMS' \
            --dir "$RUNNER_TEMP/release-baseline"
          (cd "$RUNNER_TEMP/release-baseline" && sha256sum -c SHA256SUMS)
          baseline_apk="$(find "$RUNNER_TEMP/release-baseline" -maxdepth 1 -name '*.apk' -print -quit)"
          candidate_apk="${{ steps.version.outputs.dist }}/termuxpro-${version_name}-arm64-v8a.apk"
          export AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ./scripts/verify-release-apk-on-device.sh "$baseline_apk" "$candidate_apk" \
            "$version_name" "$version_code" test-artifacts/release-apk
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.dist }}/termuxpro-${{ steps.version.outputs.name }}-arm64-v8a.apk" \
            "${{ steps.version.outputs.dist }}/SHA256SUMS" \
            "${{ steps.version.outputs.dist }}/APK_SIGNATURE.txt" \
            --verify-tag \
            --title "TermuxPro $GITHUB_REF_NAME" \
            --notes-file "${{ steps.version.outputs.dist }}/RELEASE_NOTES.md" \
            "${release_flags[@]}"
      - name: 上传发布验收证据
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-release-device-gate-${{ github.run_number }}
          path: |
            test-artifacts/release-apk/
            ${{ runner.temp }}/termuxpro-release-emulator.log
          if-no-files-found: warn
          retention-days: 30
      - name: 关闭发布验收模拟器
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: adb emu kill || true
