name: TermuxPro Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 校验唯一版本源与标签
        id: version
        run: |
          version_name="$(./scripts/termuxpro-version.sh name)"
          version_code="$(./scripts/termuxpro-version.sh code)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./scripts/termuxpro-version.sh tag "$GITHUB_REF_NAME" >/dev/null
            echo "TERMUXPRO_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "dist=dist/$version_name" >> "$GITHUB_OUTPUT"
      - name: 安装 Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: 恢复 Release 签名材料
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUXPRO_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo '缺少 TermuxPro Release 签名 Secrets。' >&2
            exit 1
          fi
          install -d -m 700 .signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .signing/termuxpro-release.p12
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > .signing/termuxpro-release.pass
          chmod 600 .signing/termuxpro-release.p12 .signing/termuxpro-release.pass
      - name: 测试、校验并构建正式 APK
        run: |
          for attempt in 1 2 3; do
            echo "正式构建：第 $attempt 次尝试"
            if ./scripts/build-termuxpro-release.sh; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo '构建失败，等待 10 秒后重试，以容忍依赖下载连接重置。'
              sleep 10
            fi
          done
          exit 1
      - name: 上传正式 APK 与校验报告
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ steps.version.outputs.dist }}/
          if-no-files-found: error
          retention-days: 30
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.version.outputs.dist }}/termuxpro-${{ steps.version.outputs.name }}-arm64-v8a.apk" \
            "${{ steps.version.outputs.dist }}/SHA256SUMS" \
            "${{ steps.version.outputs.dist }}/APK_SIGNATURE.txt" \
            --verify-tag \
            --title "TermuxPro $GITHUB_REF_NAME" \
            --notes-file "${{ steps.version.outputs.dist }}/RELEASE_NOTES.md" \
            "${release_flags[@]}"
      - name: 验收已发布候选 APK 的覆盖升级
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          (contains(github.ref_name, '-alpha.') ||
           contains(github.ref_name, '-beta.') ||
           contains(github.ref_name, '-rc.'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          requested_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run ui-emulator.yml --ref "$GITHUB_REF_NAME"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow ui-emulator.yml \
              --commit "$GITHUB_SHA" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$requested_at\")][0].databaseId // empty")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo '未找到候选 APK 模拟器验收流水线。' >&2
            exit 1
          fi
          echo "等待模拟器验收流水线：$run_id"
          gh run watch "$run_id" --exit-status
