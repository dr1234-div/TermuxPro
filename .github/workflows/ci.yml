name: TermuxPro CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 安装 Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: 检查仓库秘密边界
        run: |
          forbidden_files="$(git ls-files | grep -E '(^|/)(\.signing/|.*\.(p12|jks|keystore|key)$|.*\.pass$)' | grep -v '^app/testkey_untrusted\.jks$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            echo '仓库包含禁止提交的签名秘密' >&2
            printf '%s\n' "$forbidden_files" >&2
            exit 1
          fi
      - name: 启动隔离 SSH 与 tmux fixture
        run: ./scripts/start-ssh-fixture.sh
      - name: 全模块测试
        run: |
          for attempt in 1 2 3; do
            echo "全模块测试：第 $attempt 次尝试"
            if ./scripts/test-all.sh; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo '构建失败，等待 10 秒后重试，以容忍依赖下载连接重置。'
              sleep 10
            fi
          done
          exit 1
      - name: Lint 与 Debug APK
        run: ./gradlew --no-daemon --max-workers=2 lint :app:assembleDebug
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: termuxpro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
