buildscript {
    repositories {
        // 当前共享构建机无法直连 Google Maven，镜像仅作为依赖代理，版本仍由上游锁定。
        maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url "https://jitpack.io" }
    }
}
