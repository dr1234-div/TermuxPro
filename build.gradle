buildscript {
    repositories {
        google()
        mavenCentral()
        // 中国网络环境的回退代理；依赖版本仍由工程锁定。
        maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url "https://jitpack.io" }
    }
}
